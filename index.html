<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hikaru // Info</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Ambient Audio Overlay (Click to enter) -->
  <div id="enter-overlay" class="enter-overlay">
    <div class="enter-content">
      <span class="enter-sub">[ CLICK TO ENTER ]</span>
    </div>
  </div>

  <!-- Background Layer -->
  <div class="bg-wrapper">
    <div class="bg-image"></div>
    <div class="bg-vignette"></div>
    <div class="bg-scanline"></div>
    <canvas id="particle-canvas"></canvas>
  </div>

  <!-- Audio Toggle Top Left -->
  <button id="audio-toggle" class="audio-btn" aria-label="Toggle Audio">
    <svg id="icon-volume" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
      <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
      <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
    </svg>
    <svg id="icon-muted" class="hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
      <line x1="23" y1="9" x2="17" y2="15"></line>
      <line x1="17" y1="9" x2="23" y2="15"></line>
    </svg>
  </button>

  <!-- Main Profile Card Container -->
  <main class="page-container">
    <div class="card-wrap" id="tilt-card">
      <!-- Profile Header -->
      <section class="avatar-section">
        <div class="avatar-halo">
          <div class="pink-horns-glow">
            <span class="horn left"></span>
            <span class="horn right"></span>
          </div>
          <div class="avatar-frame">
            <img src="picture/profile%20avaTAR.jpg" alt="Hikaru Avatar" class="avatar-img" onerror="this.src='picture/profile avaTAR.jpg'" />
          </div>
          <div class="avatar-badge">夜</div>
        </div>

        <h1 class="profile-name">Hikaru</h1>
        <p class="profile-tagline">Poor Iranian</p>

        <div class="location-badge">
          <svg viewBox="0 0 24 24" fill="currentColor" class="badge-pin">
            <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
          </svg>
          <span>IRAN</span>
        </div>
      </section>

      <!-- Discord / Activity Micro-Card -->
      <section class="presence-card">
        <div class="presence-avatar-wrap">
          <img src="picture/profile%20avaTAR.jpg" alt="Status Avatar" class="presence-avatar" onerror="this.src='picture/profile avaTAR.jpg'" />
          <span class="status-indicator online"></span>
        </div>
        <div class="presence-details">
          <div class="presence-head">
            <span class="presence-user">hikaru.mp4</span>
            <span class="badge-flag">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="flag-icon"><circle cx="12" cy="12" r="10"></circle><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"></path><path d="M2 12h20"></path></svg>
              USA
            </span>
          </div>
          <span class="presence-status">Not seen 5 hours ago</span>
        </div>
      </section>

      <!-- Social Links Row -->
      <nav class="socials-row">
        <a href="https://discord.com" target="_blank" rel="noopener" class="social-icon" title="Discord" aria-label="Discord">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994.021-.041.001-.09-.041-.106a13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.929 1.793 8.18 1.793 12.061 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.893.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.028zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/>
          </svg>
        </a>
        <a href="https://steamcommunity.com" target="_blank" rel="noopener" class="social-icon" title="Steam" aria-label="Steam">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M11.979 0C5.678 0 .511 4.86.022 11.037l6.432 2.658c.545-.371 1.203-.59 1.912-.59.063 0 .125.004.188.006l2.861-4.142V8.91c0-2.495 2.028-4.524 4.524-4.524 2.494 0 4.524 2.031 4.524 4.527s-2.03 4.525-4.524 4.525h-.105l-4.076 2.911c0 .052.005.105.005.159 0 1.875-1.515 3.396-3.39 3.396-1.635 0-3.016-1.173-3.331-2.723L.586 15.01C2.033 20.207 6.643 24 11.979 24c6.627 0 12-5.373 12-12S18.605 0 11.979 0zM7.55 18.002l-1.921-.795c.319.605.908 1.05 1.618 1.178.682.122 1.378-.066 1.884-.509-.434.124-.897.126-1.581.126zm8.39-11.458c-1.302 0-2.36 1.058-2.36 2.36s1.058 2.36 2.36 2.36 2.36-1.058 2.36-2.36-1.058-2.36-2.36-2.36zm-.001.787c.87 0 1.573.704 1.573 1.573s-.703 1.573-1.573 1.573-1.573-.704-1.573-1.573.703-1.573 1.573-1.573z"/>
          </svg>
        </a>
      </nav>

      <!-- Music Player Bar -->
      <footer class="player-bar">
        <div class="player-views">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="view-icon">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
          <span id="view-count">3</span>
        </div>

        <div class="player-track">
          <img src="picture/profile%20avaTAR.jpg" alt="Track Art" class="track-thumb" onerror="this.src='picture/profile avaTAR.jpg'" />
          <div class="track-info">
            <div class="track-title-wrap">
              <span class="track-title" id="track-title">Cigarettes out the Window</span>
            </div>
            <div class="track-progress-wrap">
              <span id="curr-time" class="time-label">0:00</span>
              <div class="progress-bar-container" id="progress-container">
                <div class="progress-fill" id="progress-fill"></div>
              </div>
              <span id="total-time" class="time-label">0:00</span>
            </div>
          </div>
        </div>

        <div class="player-controls">
          <button id="btn-prev" class="ctrl-btn" aria-label="Previous Track">
            <svg viewBox="0 0 24 24" fill="currentColor"><polygon points="19 20 9 12 19 4 19 20"></polygon><line x1="5" y1="19" x2="5" y2="5" stroke="currentColor" stroke-width="2"></line></svg>
          </button>
          <button id="btn-play" class="ctrl-btn main-ctrl" aria-label="Play/Pause">
            <svg id="icon-play" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
            <svg id="icon-pause" class="hidden" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>
          </button>
          <button id="btn-next" class="ctrl-btn" aria-label="Next Track">
            <svg viewBox="0 0 24 24" fill="currentColor"><polygon points="5 4 15 12 5 20 5 4"></polygon><line x1="19" y1="5" x2="19" y2="19" stroke="currentColor" stroke-width="2"></line></svg>
          </button>
        </div>
      </footer>
    </div>
  </main>

  <audio id="audio-player" preload="metadata"></audio>
  <script src="main.js"></script>
</body>
</html>
